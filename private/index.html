<!doctype html>
<html lang="zh-Hant" data-theme="milan-amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>RSI 顧問文件</title>
<style>
  :root, [data-theme="milan-amber"] {
    --bg-primary: #FFFFFF; --bg-surface: #FBFBFA; --bg-card: #F6EEE8; --border-color: #E7E2DC;
    --text-primary: #2D3748; --text-muted: #6B7280; --accent-primary: #DE5814; --accent-rust: #A83212; --accent-amber: #D97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-primary); color: var(--text-primary);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 1080px; margin: 0 auto; padding: 48px 16px 72px; }
  .kicker { color: var(--accent-rust); font-weight: 700; font-size: 12px; letter-spacing: .28em; }
  h1 { font-size: clamp(28px, 6vw, 40px); margin: 10px 0 4px; line-height: 1.25; }
  .en { font-family: Cambria, Georgia, serif; font-style: italic; color: var(--accent-primary); font-size: 18px; margin: 0 0 28px;
    padding-bottom: 16px; border-bottom: 1px solid var(--accent-primary); }
  .panel { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 24px; max-width: 640px; }
  label { display: block; font-weight: 700; color: var(--accent-rust); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input { flex: 1 1 220px; font: inherit; padding: 12px 14px; border: 1px solid var(--border-color); background: #fff; color: var(--text-primary); }
  input:focus { outline: 2px solid var(--accent-primary); outline-offset: 1px; }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border: 0; background: var(--accent-rust); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent-rust); border: 1px solid var(--accent-rust); }
  button:hover { background: var(--accent-primary); color: #fff; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 1.6em; margin-top: 10px; color: var(--accent-rust); font-size: 14px; }
  .note { color: var(--text-muted); font-size: 13px; margin-top: 14px; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 16px 18px; margin-bottom: 12px; }
  li.on { background: var(--bg-card); border-color: var(--accent-primary); }
  .ft { font-family: Cambria, Georgia, serif; font-style: italic; color: var(--accent-primary); font-size: 14px; }
  .t { font-weight: 700; font-size: 16px; margin: 2px 0 4px; }
  .size { color: var(--text-muted); font-size: 12px; overflow-wrap: anywhere; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .viewer { border: 1px solid var(--border-color); background: var(--bg-surface); min-height: 70vh; display: flex; }
  .viewer iframe { width: 100%; height: 82vh; border: 0; background: #fff; }
  .empty { margin: auto; color: var(--text-muted); padding: 40px; text-align: center; }
  [hidden] { display: none !important; }
  footer { margin-top: 40px; color: var(--text-muted); font-size: 12px; font-family: Cambria, Georgia, serif; font-style: italic; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .viewer iframe { height: 75vh; } }
</style>
</head>
<body>
<main>
  <div class="kicker">RSI GROUP · PRIVATE DOCUMENTS</div>
  <h1>RSI 顧問文件</h1>
  <p class="en">Consulting Agreement, Profile &amp; Hive WBS</p>

  <section id="lock" class="panel">
    <form id="f">
      <label for="pw">請輸入密碼</label>
      <div class="row">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button id="go" type="submit">解鎖</button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <p class="note">檔案以 AES-256 加密存放，只在你的瀏覽器內解密，密碼不會送到任何伺服器。</p>
  </section>

  <section id="list" class="grid" hidden>
    <div>
      <ul id="items"></ul>
      <p class="note">所有文件皆為 PDF，並附 Howard Liao Ph.D. 浮水印。</p>
    </div>
    <div class="viewer" id="viewer"><div class="empty">選擇左側文件以預覽</div></div>
  </section>

  <footer>Howard Liao, Ph.D.</footer>
</main>
<script>
(() => {
  const te = new TextEncoder();
  let pw = "", iter = 600000;
  const cache = new Map();
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";

  async function open(buf, it) {
    const b = new Uint8Array(buf);
    if (new TextDecoder().decode(b.slice(0, 5)) !== "RSIE1") throw new Error("format");
    const salt = b.slice(5, 21), iv = b.slice(21, 33), ct = b.slice(33);
    const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  }
  async function fetchBuf(p) {
    const r = await fetch(p, { cache: "no-store" });
    if (!r.ok) throw new Error("fetch " + r.status);
    return r.arrayBuffer();
  }
  async function blobUrl(f) {
    if (!cache.has(f.id)) {
      const data = await open(await fetchBuf(f.id), iter);
      cache.set(f.id, URL.createObjectURL(new Blob([data], { type: "application/pdf" })));
    }
    return cache.get(f.id);
  }
  async function busy(btn, label, fn) {
    const old = btn.textContent; btn.disabled = true; btn.textContent = label;
    try { await fn(); btn.textContent = old; } catch (e) { btn.textContent = "失敗，請重試"; }
    btn.disabled = false;
  }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    pw = $("pw").value; $("go").disabled = true; $("msg").textContent = "驗證中…";
    try {
      const man = JSON.parse(new TextDecoder().decode(await open(await fetchBuf("manifest.enc"), iter)));
      iter = man.iter || iter;
      const ul = $("items"); ul.innerHTML = "";
      man.files.forEach((f, i) => {
        const li = document.createElement("li");
        li.innerHTML = '<div class="ft"></div><div class="t"></div><div class="size"></div>' +
          '<div class="acts"><button type="button" class="pv">預覽</button><button type="button" class="ghost dl">下載 PDF</button></div>';
        li.querySelector(".ft").textContent = f.kind;
        li.querySelector(".t").textContent = f.title;
        li.querySelector(".size").textContent = f.name + " · " + fmt(f.size);
        const pv = li.querySelector(".pv"), dl = li.querySelector(".dl");
        pv.addEventListener("click", () => busy(pv, "解密中…", async () => {
          const url = await blobUrl(f);
          document.querySelectorAll("#items li").forEach((x) => x.classList.remove("on"));
          li.classList.add("on");
          $("viewer").innerHTML = "";
          const fr = document.createElement("iframe");
          fr.title = f.title; fr.src = url + "#view=FitH&navpanes=0";
          $("viewer").appendChild(fr);
        }));
        dl.addEventListener("click", () => busy(dl, "解密中…", async () => {
          const a = document.createElement("a"); a.href = await blobUrl(f); a.download = f.name;
          document.body.appendChild(a); a.click(); a.remove();
        }));
        ul.appendChild(li);
        if (i === 0) setTimeout(() => pv.click(), 0);
      });
      $("lock").hidden = true; $("list").hidden = false;
    } catch (err) {
      $("msg").textContent = "密碼不正確，或檔案無法讀取。";
    }
    $("go").disabled = false;
  });
})();
</script>
</body>
</html>
