<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活黑客群島 · RSI 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app. Header + section/filter rail, then the 3D table; reading happens in a right panel (desktop) or bottom sheet (phone). List mode replaces the table with the full original-order page on the same data and filters. */
:root {
  --cream: #FBF7EF; --paper: #F3ECE0; --beige: #E7D9C3;
  --sage: #7F9F86; --sage-deep: #4F6E5A; --coral: #DD7C5E; --coral-deep: #B65A3E;
  --sea: #A5C3CA; --sea-deep: #4F7885; --ink: #36322C; --ink-soft: #6B6358; --line: #E1D5C1; --card: #FFFDF8; --focus: #2F6E7E;
  --run: #6F8F9A; --grow: #7F9F86; --transform: #DD7C5E;
  --f-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --shadow: 0 1px 0 rgba(80,60,30,.06), 0 8px 24px -10px rgba(80,60,30,.28);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; overflow: hidden; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cream); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--sea-deep); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.top { background: var(--cream); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .04em; line-height: 1.1; }
.brand-tag { font-size: 12px; color: var(--ink-soft); line-height: 1.25; }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-width: 0; max-width: 420px; }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; padding: 2px 0; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(47,110,126,.18); }
.search .clear { border: 0; background: none; color: var(--ink-soft); padding: 0 4px; font-size: 18px; line-height: 1; }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--beige); background: #fff; }
.btn-primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 700; }
.btn-primary:hover { background: var(--coral-deep); border-color: var(--coral-deep); }
.rail { background: var(--cream); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; overflow-x: auto; scrollbar-width: none; position: relative; z-index: 4; }
.rail::-webkit-scrollbar { display: none; }
.rail-label { font-size: 12px; color: var(--ink-soft); letter-spacing: .08em; white-space: nowrap; }
.chips { display: flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.chip .dot { width: 9px; height: 9px; border-radius: 3px; transform: rotate(45deg); flex: none; }
.rail .sep { width: 1px; align-self: stretch; background: var(--line); flex: none; }
.main { position: relative; min-height: 0; overflow: hidden; }
.stage { position: absolute; inset: 0; touch-action: none; outline: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; border: 1px solid var(--line); background: rgba(255,253,248,.95); border-radius: 12px; padding: 4px 10px 5px; text-align: center; box-shadow: var(--shadow); white-space: nowrap; transition: opacity .2s; }
.lbl .n { font-family: var(--f-display); font-weight: 700; font-size: 15px; display: block; line-height: 1.25; }
.lbl .m { font-size: 11.5px; color: var(--ink-soft); display: block; font-variant-numeric: tabular-nums; }
.lbl.pillar { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.lbl.pillar .m { color: #D8CDBB; }
.lbl.small { padding: 2px 8px 3px; }
.lbl.small .n { font-size: 13px; }
.lbl[data-active="true"] { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(221,124,94,.3), var(--shadow); }
.lbl[data-dim="true"] { opacity: .45; }
.tip { position: absolute; z-index: 3; width: 270px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; box-shadow: var(--shadow); pointer-events: none; font-size: 13px; }
.tip h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: 16px; }
.tip p { margin: 0 0 6px; color: var(--ink-soft); }
.tip .hint { color: var(--sea-deep); font-weight: 500; }
.intro { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); top: 16px; width: min(400px, calc(100% - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px 22px; box-shadow: var(--shadow); }
.intro .eyebrow { padding-right: 28px; font-size: 12px; letter-spacing: .1em; color: var(--sage-deep); font-weight: 700; }
.intro h1 { font-family: var(--f-display); font-size: 23px; line-height: 1.35; margin: 4px 0 8px; text-wrap: balance; }
.intro p { margin: 0 0 12px; color: var(--ink-soft); font-size: 14px; }
.intro .stats { display: flex; gap: 18px; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.intro .stats b { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1.1; color: var(--ink); }
.intro .stats span { font-size: 12px; color: var(--ink-soft); }
.intro .row { display: flex; gap: 8px; flex-wrap: wrap; }
.intro .x { position: absolute; right: 10px; top: 10px; border: 0; background: none; font-size: 20px; color: var(--ink-soft); width: 32px; height: 32px; }
.ctrl { position: absolute; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.ctrl .stack { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.ctrl .stack button { border: 0; background: none; width: 40px; height: 40px; font-size: 20px; }
.ctrl .stack button + button { border-top: 1px solid var(--line); }
.status { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; max-width: calc(100% - 140px); }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.src { background: #EEF4EE; border-color: #C9DACB; color: var(--sage-deep); font-weight: 700; }
.panel { position: absolute; z-index: 6; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--cream); border-left: 1px solid var(--line); box-shadow: -12px 0 30px -18px rgba(80,60,30,.45); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.panel.open { transform: none; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-head .grab { display: none; }
.panel-head .spacer { flex: 1; }
.panel-body { overflow-y: auto; padding: 18px 20px calc(28px + env(safe-area-inset-bottom, 0px)); flex: 1; min-height: 0; }
.eyb { font-size: 12px; letter-spacing: .08em; color: var(--sage-deep); font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.h2 { font-family: var(--f-display); font-size: 25px; line-height: 1.32; margin: 2px 0 6px; text-wrap: balance; outline: none; }
.lead { color: var(--ink-soft); margin: 0 0 12px; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); }
.cards { display: grid; gap: 10px; }
.icard { text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
button.icard:hover { border-color: var(--beige); box-shadow: var(--shadow); }
.icard h3 { margin: 0; font-size: 16px; line-height: 1.45; font-weight: 700; }
.icard p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.icard .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tag { background: var(--paper); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--ink-soft); }
.code { font-weight: 700; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
.rgt { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 0 7px; border: 1px solid; }
.rgt.Run { color: #3E5A64; border-color: #B8CDD3; background: #EAF1F3; }
.rgt.Grow { color: #3F5E48; border-color: #BFD3C3; background: #EBF2EC; }
.rgt.Transform { color: #8D3A22; border-color: #E9B3A1; background: #FBE3DB; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; }
.facts dt { color: var(--ink-soft); white-space: nowrap; }
.facts dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.h3 { font-size: 14px; letter-spacing: .06em; color: var(--sage-deep); margin: 18px 0 6px; }
.note { font-size: 12px; color: #6A5414; background: #FBF1D3; border-radius: var(--r-s); padding: 6px 10px; }
.origin { font-size: 12px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.origin .o { background: #EEF4EE; color: var(--sage-deep); border-radius: 6px; padding: 1px 7px; font-weight: 700; }
.origin .n { background: #FBE3DB; color: #8D3A22; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; }
.bar .track { grid-column: 1 / -1; height: 9px; background: var(--paper); border-radius: 5px; overflow: hidden; display: flex; }
.bar .fill { height: 100%; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); margin: 4px 0 8px; }
.legend i { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.slider { display: grid; gap: 4px; margin-bottom: 12px; }
.slider label { display: flex; justify-content: space-between; font-size: 13px; }
.slider input { width: 100%; accent-color: var(--coral); }
.outgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.out { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; }
.out b { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.out span { font-size: 12px; color: var(--ink-soft); }
.gate { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.gate input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--sage-deep); flex: none; }
.gate b { display: block; font-size: 14px; }
.gate span { font-size: 12.5px; color: var(--ink-soft); }
.result { border-radius: var(--r-m); padding: 12px 14px; margin-top: 4px; }
.result.ok { background: #EBF2EC; border: 1px solid #BFD3C3; }
.result.block { background: #FBE3DB; border: 1px solid #E9B3A1; }
.result b { display: block; font-family: var(--f-display); font-size: 18px; }
.wtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.wtable th { text-align: left; font-weight: 700; color: var(--ink-soft); border-bottom: 1px solid var(--line); padding: 6px 6px; white-space: nowrap; }
.wtable td { border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top; }
.scroll-x { overflow-x: auto; }
.layer { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: start; }
.layer .num { font-family: var(--f-display); font-size: 20px; color: var(--coral-deep); font-weight: 700; }
ul.clean { margin: 0; padding-left: 18px; font-size: 13.5px; }
ul.clean li { margin: 2px 0; }
.list { position: absolute; inset: 0; overflow-y: auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list-inner { max-width: 1120px; margin: 0 auto; }
.lsec { margin-bottom: 30px; scroll-margin-top: 10px; }
.lsec > h2 { font-family: var(--f-display); font-size: 24px; margin: 0 0 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lsec > h2 .hex { width: 16px; height: 16px; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); background: var(--sage); flex: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.loading { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; background: var(--paper); text-align: center; }
.loading .hexspin { width: 46px; height: 46px; background: var(--sage); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); margin: 0 auto 12px; animation: spin 1.6s ease-in-out infinite; }
@keyframes spin { 50% { transform: rotate(180deg) scale(.85); background: var(--coral); } }
.toast { position: absolute; z-index: 8; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 0); background: var(--ink); color: var(--cream); border-radius: 14px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; max-width: min(520px, calc(100% - 32px)); font-size: 14px; }
.toast .x { border: 0; background: none; color: #D8CDBB; font-size: 18px; }
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(54,50,44,.35); display: grid; place-items: center; padding: 16px; }
.modal-box { background: var(--cream); border-radius: var(--r-l); max-width: 1000px; width: 100%; max-height: 100%; overflow-y: auto; padding: 22px 24px; box-shadow: var(--shadow); }
.modal-box h2 { font-family: var(--f-display); margin: 0 0 8px; font-size: 24px; }
.modal-box p, .modal-box li { color: var(--ink-soft); font-size: 14px; }
@media (max-width: 760px) {
  .brand-tag { display: none; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .top-actions .btn .lbltext { display: none; }
  .panel { top: auto; left: 0; width: 100%; height: 66%; border-left: 0; border-top: 1px solid var(--line); border-radius: var(--r-l) var(--r-l) 0 0; transform: translateY(105%); }
  .panel.tall { height: 92%; }
  .panel-head .grab { display: inline-flex; }
  .intro { padding: 16px 18px; }
  .intro h1 { font-size: 18px; }
  .intro p, .intro .stats { display: none; }
  .tip { display: none; }
  .lbl .n { font-size: 13px; }
  .lbl .m { display: none; }
  .lbl.small { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<body>


<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 30 9.5v15L17 32 4 24.5v-15z" fill="#7F9F86"/><path d="M17 9 23.5 12.8v7.4L17 24l-6.5-3.8v-7.4z" fill="#FBF7EF"/><circle cx="17" cy="16.5" r="2.6" fill="#DD7C5E"/></svg>
      <div><div class="brand-name">生活黑客群島</div><div class="brand-tag">RSI 2027 IT 營運計畫・群島版</div></div>
    </div>
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="#6B6358" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="#6B6358" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="sr-only">搜尋藍圖</span>
      <input id="q" type="search" placeholder="搜尋藍圖：API、MDM、4-Gate、P3-5…" autocomplete="off">
      <button class="clear" id="qClear" type="button" aria-label="清除搜尋" hidden>×</button>
    </label>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="瀏覽模式"><button type="button" id="mCity" aria-pressed="true">城市模式</button><button type="button" id="mList" aria-pressed="false">清單模式</button></div>
      <button class="btn" type="button" id="mapBtn"><span aria-hidden="true">⇄</span><span class="lbltext">映射表</span><span class="sr-only">原站與群島映射表</span></button>
      <a class="btn" id="srcLink" target="_blank" rel="noopener"><span aria-hidden="true">↗</span><span class="lbltext">原站</span><span class="sr-only">開啟原站</span></a>
    </div>
  </header>
  <nav class="rail" aria-label="原站章節與篩選">
    <span class="rail-label">原站章節</span><div class="chips" id="navChips"></div>
    <span class="sep" aria-hidden="true"></span>
    <span class="rail-label">主架構</span><div class="chips" id="pChips"></div>
    <span class="sep" aria-hidden="true"></span>
    <span class="rail-label">資本屬性</span><div class="chips" id="rChips"></div>
  </nav>
  <main class="main" id="main">
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="RSI 群島地圖。拖曳或方向鍵平移，滾輪或加減鍵縮放，按 0 回到全景，Tab 選擇島嶼與地標。">
      <div class="labels" id="labels"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="list" id="list" hidden></div>
    <section class="intro" id="intro" aria-labelledby="introTitle">
      <button class="x" type="button" id="introClose" aria-label="關閉介紹">×</button>
      <div class="eyebrow" id="introEyebrow"></div>
      <h1 id="introTitle"></h1>
      <p id="introText"></p>
      <div class="stats" id="introStats"></div>
      <div class="row"><button class="btn btn-primary" type="button" id="introHive">看蜂巢時程</button><button class="btn" type="button" id="exploreBtn">探索四大主架構</button></div>
    </section>
    <div class="status" id="status"></div>
    <div class="ctrl" id="ctrl">
      <button class="btn" type="button" id="homeBtn">⌂ 回到全景</button>
      <div class="stack"><button type="button" id="zin" aria-label="放大">+</button><button type="button" id="zout" aria-label="縮小">−</button></div>
